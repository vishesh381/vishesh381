<svg xmlns="http://www.w3.org/2000/svg" width="196" height="44" viewBox="0 0 196 44" role="img" aria-label="Read my resume"><title>Read my resume</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c3a"/><stop offset=".55" stop-color="#14253b"/><stop offset="1" stop-color="#251e40"/></linearGradient><linearGradient id="accent"><stop stop-color="#35d9ff"/><stop offset=".5" stop-color="#9e8cff"/><stop offset="1" stop-color="#ff9cc8"/></linearGradient><linearGradient id="metal" x2=".2" y2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#b8c6f1"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8cc7ff" stroke-opacity=".08"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.hover{animation:float 4s ease-in-out infinite}.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 2s ease-in-out infinite}.cursor{animation:cursor 1s steps(2) infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes blink{0%,44%,49%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{to{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="194" height="42" rx="11" fill="#7755dc"/><path d="M8 4h9l5 5v15H8zM16 4v6h6M11 14h8M11 18h6" transform="translate(10 7) scale(.85)" fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><text x="45" y="27" fill="white" font-size="15" font-weight="600">Read my resume</text></svg>