<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="title desc">
  <title id="title">Vishesh Sharma</title><desc id="desc">AI engineer and full-stack developer in New York. Salesforce, AI agents, and web applications.</desc>
